title: OpenFE RBFE - jacs_set (8 systems) - 2026-09-28-openff3.0.0-alpha2b_opc3-jacs
summary: 'This submission describes the RBFE benchmark covering jacs_set: bace, cdk2,
  jnk1, mcl1, p38, ptp1b, thrombin, tyk2 prepared with opc3.offxml/openff-3.0.0-alpha2b
  for proteins and solvents, and openff-3.0.0-alpha2b with nagl_openff-gnn-am1bcc-1.0.0.pt
  for ligands, solutes, and cofactors. The submission contains 566 edges across 194
  unique ligands. Results are derived from archived Alchemiscale workflow data. For
  scripts to generate this network: github.com/openforcefield/alchemical-benchmark-resources/submissions/2026-09-11_openff-3.0.0-alpha2b_opc3/alchemiscale_submission.ipynb'
