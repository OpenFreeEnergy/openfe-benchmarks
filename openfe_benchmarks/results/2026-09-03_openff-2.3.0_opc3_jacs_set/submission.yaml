title: OpenFE RBFE - jacs_set (7 systems) - 2026-09-03_openff-2.3.0_opc3_jacs_set
summary: 'This submission describes the RBFE benchmark covering jacs_set: bace, jnk1,
  mcl1, p38, ptp1b, thrombin, tyk2 prepared with ff14SB/lipid17_merged/opc3_standard/phosaa10
  for proteins and solvents, and openff-2.3.0 with nagl_openff-gnn-am1bcc-1.0.0.pt
  for ligands, solutes, and cofactors. The submission contains 518 edges across 183
  unique ligands. Results are derived from archived Alchemiscale workflow data. For
  scripts to generate this network: github.com/openforcefield/alchemical-benchmark-resources/submissions/2026-08-31_openff-2.3.0_opc3_jacs_set'
