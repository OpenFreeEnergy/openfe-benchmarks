# REQUIRED: unique, kebab-case identifier for this submission
submission_id: 2026-07-31_sage_230_all

# REQUIRED: short descriptive title
title: OpenFE RBFE - Multi-set Benchmark (6 sets, 35 systems) - 2026-07-31_sage_230_all

# REQUIRED: short descriptive summary (1-2 sentences)
summary: |
  This submission describes the RBFE benchmark covering fragments: hsp90_2rings, hsp90_single_ring,
  jak2_set1, jak2_set2, liga, mcl1, mup1, p38, t4_lysozyme, janssen_bace: bace_ciordia_prospective,
  bace_p3_arg368_in, ciordia_retro, keranen_p2, mcs_docking_set: hne, renin, merck: cdk8, cmet, eg5,
  hif2a, pfkfb3, shp2, syk, tnks2, miscellaneous_set: btk, cdk8, faah, galectin, hiv1_protease,
  water_set: brd4, chk1, hsp90_kung, hsp90_woodhead, scyt_dehyd, taf12, thrombin, urokinase prepared
  with ff14SB/phosaa10/tip3p_HFE_multivalent/tip3p_standard for proteins and solvents, and openff-2.3.0 with nagl_openff-gnn-am1bcc-1.0.0.pt
  for ligands, solutes, and cofactors. The submission contains 1690 edges, 411 unique ligands. 4
  systems include cofactors (EPE-1, cofactors_molecule, cofactors_molecule1, glycerol,
  pfkfb3_automap_cofactor1, pfkfb3_automap_cofactor2, pfkfb3_automap_cofactor3). Results are derived
  from archived Alchemiscale workflow data. The results interpolate the 1-4 exceptions using the `turn_off_core_unique_exceptions` setting.

