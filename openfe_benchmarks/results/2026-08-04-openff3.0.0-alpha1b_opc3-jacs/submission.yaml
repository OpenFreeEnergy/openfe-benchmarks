# REQUIRED: unique, kebab-case identifier for this submission
submission_id: 2026-08-04-openff3.0.0-alpha1b_opc3-jacs

# REQUIRED: short descriptive title
title: OpenFE RBFE - jacs_set (8 systems) - 2026-08-04-openff3.0.0-alpha1b_opc3-jacs

# REQUIRED: short descriptive summary (1-2 sentences)
summary: |
  This submission describes the RBFE benchmark covering the jacs_set benchmark set (bace, cdk2, jnk1,
  mcl1, p38, ptp1b, thrombin, tyk2) prepared with opc3.offxml/openff-3.0.0-alpha1b for proteins and
  solvents, and openff-3.0.0-alpha1b with nagl_openff-gnn-am1bcc-1.0.0.pt for ligands, solutes, and
  cofactors. The network contains 566 edges across 194 unique ligands. Results are derived from
  archived Alchemiscale workflow data. For scripts to generate this network:
  github.com/openforcefield/alchemical-benchmark-
  resources/submissions/2026_07_15_openff-3.0.0-alpha1b_opc3/alchemiscale_submission.ipynb

# REQUIRED: list of submission tags
tags: [rbfe, alchemicalarchive, opc3.offxml, openff-3.0.0-alpha1b, bace, cdk2, jacs_set, jnk1, mcl1, p38, ptp1b, thrombin, tyk2, nagl_openff-gnn-am1bcc-1.0.0.pt, benchmark, pontibus]

# REQUIRED: calculation type (asfe, rbfe, etc.)
